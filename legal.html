<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legal & Support | $ DOLLOR</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#010704;color:#f5fff8;font:16px/1.8 Arial,sans-serif}header{border-bottom:1px solid #18653b;padding:18px max(20px,6vw);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;background:#03130a}.brand{color:#31ff82;font-size:25px;font-weight:900;text-decoration:none;text-shadow:0 0 16px #1dff7b77}a{color:#31ff82}main{max-width:1080px;margin:auto;padding:45px 24px 90px}h1{font-size:clamp(30px,4vw,46px);text-align:center;margin:0 0 12px}h2{font-size:23px;color:#ecfff2;margin:32px 0 12px}p,li{color:#c5d6ca}ul{padding-left:24px}.crumb{text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#8bbda1;margin-bottom:36px}.intro{border-left:3px solid #31ff82;padding:16px 20px;background:#061b10;border-radius:5px}.updated{color:#8bbda1;font-size:13px}footer{border-top:1px solid #1e663f;padding:24px;text-align:center;color:#8bbda1}.notice{border:1px solid #1e663f;border-radius:12px;background:#061b10;padding:14px;margin-top:45px;font-size:13px;color:#b4d5c0}</style></head><body><header><a class="brand" href="/">$ DOLLOR</a><a href="/">← Back to Home</a></header><main><h1 id="title">Legal & Support</h1><div class="crumb"><a href="/">Home</a> › <span id="crumb">Legal & Support</span></div><p id="updated" class="updated"></p><p id="intro" class="intro"></p><article id="body"></article><div class="notice">Information on this page is maintained by the website administrator. Please contact support if you need clarification.</div></main><footer>© 2026 $ DOLLOR. All rights reserved.</footer><script>
(async()=>{const slug=new URLSearchParams(location.search).get('page')||'privacy';if(!['privacy','terms','support'].includes(slug)){location.replace('/');return}
const titles={privacy:'Privacy Policy',terms:'Terms & Conditions',support:'Customer Support'};document.title=titles[slug]+' | $ DOLLOR';document.getElementById('title').textContent=titles[slug];document.getElementById('crumb').textContent=titles[slug];
try{const r=await fetch('/api/legal?page='+encodeURIComponent(slug));if(!r.ok)throw Error('Content unavailable');const d=await r.json();document.getElementById('title').textContent=d.title||titles[slug];document.getElementById('crumb').textContent=d.title||titles[slug];document.getElementById('intro').textContent=d.intro||'';document.getElementById('updated').textContent=d.updated?'Last Updated: '+d.updated:'';const host=document.getElementById('body');let list=null;for(const line of String(d.body||'').split(/\r?\n/)){if(line.startsWith('## ')){list=null;const h=document.createElement('h2');h.textContent=line.slice(3);host.append(h)}else if(line.startsWith('- ')){if(!list){list=document.createElement('ul');host.append(list)}const li=document.createElement('li');li.textContent=line.slice(2);list.append(li)}else if(line.trim()){list=null;const p=document.createElement('p');p.textContent=line;host.append(p)}}}catch{document.getElementById('intro').textContent='This page is temporarily unavailable. Please try again later.'}
})();
</script></body></html>
