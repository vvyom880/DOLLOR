<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lottery Tickets | $ DOLLOR</title><style>*{box-sizing:border-box}body{margin:0;background:#010a06;color:#e8fff0;font:15px Arial,sans-serif}header{background:#062017;border-bottom:1px solid #19df76;padding:20px max(20px,5vw);display:flex;justify-content:space-between;align-items:center}a{color:#35ff8d}main{max-width:1000px;margin:auto;padding:35px 20px}.panel{background:#092016;border:1px solid #147e4b;border-radius:15px;padding:22px;margin:18px 0}.muted{color:#a7bcb2}input,button{font:inherit;border-radius:9px;padding:13px}input{background:#02110b;border:1px solid #247f50;color:white;max-width:100%;width:100%}button{background:#20d970;border:0;color:#00150b;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.day{border:1px solid #147e4b;border-radius:10px;padding:15px;margin:14px 0}.ticket{display:inline-block;border:1px solid #25de7a;border-radius:10px;padding:12px 16px;margin:7px;font-size:21px;font-weight:800;letter-spacing:2px}.muted-ticket{opacity:.55}label{display:block;margin:10px 0}</style></head><body><header><div id="lotteryLogo" style="width:160px;max-width:45vw;min-height:42px;display:flex;align-items:center"><strong style="color:#29ff8b;font-size:24px">$ DOLLOR</strong></div><a href="/">← Back to Home</a></header><main><h1>🎟 Lottery Tickets</h1><p class="muted">View your original six-digit ticket numbers</p><div class="panel"><h2>My Tickets</h2><form id="search"><div class="grid"><label>Username<input id="username" maxlength="40" pattern="[A-Za-z0-9_.-]{3,40}" required placeholder="Enter username" autocomplete="username"></label><label>Code<input id="code" type="password" inputmode="numeric" pattern="[0-9]{6}" required minlength="6" maxlength="6" placeholder="Enter 6-digit code" autocomplete="off"></label></div><div class="grid"><label>From Date<input type="date" id="from" required></label><label>To Date<input type="date" id="to" required></label></div><button id="submit" type="submit">Show My Tickets</button></form><p id="status" role="status" aria-live="polite"></p><div id="results"></div></div></main><script>
const $=s=>document.querySelector(s),today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('#from').value=today;$('#to').value=today;
$('#search').addEventListener('submit',async e=>{e.preventDefault();$('#results').replaceChildren();const username=$('#username').value.trim(),lookup_code=$('#code').value,from=$('#from').value,to=$('#to').value,days=(Date.parse(to)-Date.parse(from))/86400000+1;if(!/^[A-Za-z0-9_-]{24}$/.test(lookup_code)){$('#status').textContent='Enter the complete 24-character code generated by admin.';return}if(!Number.isFinite(days)||days<1||days>30){$('#status').textContent='Select 1–30 calendar days.';return}$('#submit').disabled=true;$('#status').textContent='Loading tickets…';try{const r=await fetch('/api/lottery/my-tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,lookup_code,from,to})}),data=await r.json();if(!r.ok)throw Error(data.error||'Could not load tickets');const total=document.createElement('h3');total.textContent='Total tickets: '+data.total;$('#results').append(total);const groups=new Map();for(const t of data.tickets){if(!groups.has(t.ticket_date))groups.set(t.ticket_date,[]);groups.get(t.ticket_date).push(t)}for(const [date,tickets] of groups){const day=document.createElement('div');day.className='day';const h=document.createElement('h3');h.textContent=date+' — '+tickets.length+' tickets';day.append(h);for(const t of tickets){const chip=document.createElement('span');chip.className='ticket'+(t.status==='active'?'':' muted-ticket');chip.textContent=t.ticket_number+(t.status==='active'?'':' ('+t.status+')');day.append(chip)}$('#results').append(day)}if(!data.total){const p=document.createElement('p');p.textContent='No tickets found for these dates.';$('#results').append(p)}$('#status').textContent='Tickets loaded.'}catch(err){$('#status').textContent=err.message}finally{$('#submit').disabled=false}});
</script><script src="/dollor-engine.js"></script><script>try{if(window.DOLLOR&&document.getElementById('lotteryLogo')){document.getElementById('lotteryLogo').replaceChildren();window.DOLLOR.mountLogo(document.getElementById('lotteryLogo'),'100%')}}catch(e){document.getElementById('lotteryLogo').textContent='$ DOLLOR'}</script></body></html>
