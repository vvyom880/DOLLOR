<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$DOLLOR | Contact Messages</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#010504;color:#e9fff0;font:14px Arial,sans-serif}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #245a3b;padding:18px 4vw}h1{font-size:24px;color:#31ff82;margin:0}main{max-width:1400px;margin:auto;padding:25px 4vw}.panel{border:1px solid #245a3b;background:#071a11;border-radius:15px;padding:20px;margin-bottom:20px}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:8px;color:#a9c9b6}input,select,button{padding:12px;border-radius:9px;border:1px solid #31734a;background:#04120b;color:#fff;font:inherit}button{background:#31ff82;color:#04220e;font-weight:bold;cursor:pointer}a{color:#31ff82}.stat{font-size:27px;color:#31ff82;font-weight:bold}.muted{color:#a9c9b6}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;border-bottom:1px solid #234631;padding:12px;vertical-align:top;max-width:360px;overflow-wrap:anywhere}th{color:#31ff82}td.message{white-space:pre-wrap}#status{min-height:20px}
</style></head><body><header><h1>$DOLLOR • Contact Messages</h1><a href="/admin/">← Back to Admin</a></header><main><section class="panel"><div class="filters"><label>Dashboard Key<input id="key" type="password" placeholder="Enter dashboard key" autocomplete="off"></label><label>Date Range<select id="period"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="weekly">Last 7 days</option><option value="monthly">Last 30 days</option><option value="all">All time</option><option value="custom">Custom dates</option></select></label><label id="fromWrap" hidden>From<input id="from" type="date"></label><label id="toWrap" hidden>To<input id="to" type="date"></label><button id="load">Load Messages</button><button id="csv">Download CSV</button><button id="excel">Download Excel</button></div><p class="muted" id="status">Enter your dashboard key to view saved contact messages.</p></section><section class="panel"><div class="muted">Messages in selected date range</div><div class="stat" id="count">—</div></section><section class="panel"><h2>Submitted Contact Forms</h2><div class="scroll"><table><thead><tr><th>Date & Time</th><th>First Name</th><th>Last Name</th><th>Email</th><th>Country Code</th><th>Phone</th><th>Message</th></tr></thead><tbody id="table"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);let rows=[];
$('period').onchange=()=>{const custom=$('period').value==='custom';$('fromWrap').hidden=!custom;$('toWrap').hidden=!custom};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function dates(){const p=$('period').value,now=new Date(),from=new Date(now),to=new Date(now);if(p==='all')return {};if(p==='custom')return {from:$('from').value,to:$('to').value};if(p==='yesterday'){from.setDate(from.getDate()-1);to.setDate(to.getDate()-1)}else if(p==='weekly')from.setDate(from.getDate()-6);else if(p==='monthly')from.setDate(from.getDate()-29);return {from:iso(from),to:iso(to)}}
$('load').onclick=async()=>{const key=$('key').value.trim();if(!key){$('status').textContent='Please enter dashboard key';return}const d=dates();if((d.from&&!d.to)||(!d.from&&d.to)){ $('status').textContent='Select both dates';return}const params=new URLSearchParams(d);$('status').textContent='Loading messages…';try{const r=await fetch('/api/contact-report?'+params,{headers:{Authorization:'Bearer '+key}}),data=await r.json();if(!r.ok)throw Error(data.error||'Unable to load');rows=data.messages||[];$('count').textContent=rows.length.toLocaleString();$('table').replaceChildren();rows.forEach(row=>{const tr=document.createElement('tr');[new Date(row.created_at).toLocaleString(),row.first_name,row.last_name,row.email,row.phone_country_code,row.phone_number,row.message].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v||'';if(i===6)td.className='message';tr.append(td)});$('table').append(tr)});$('status').textContent=rows.length+' messages loaded'+(data.truncated?' (first 50,000 only)':'')}catch(e){$('status').textContent=e.message}};
function csv(){const fields=['created_at','first_name','last_name','email','phone_country_code','phone_number','message'];return [fields.join(','),...rows.map(r=>fields.map(k=>{let v=String(r[k]??'');if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(','))].join('\r\n')}
function download(excel){const blob=new Blob(['\ufeff'+csv()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dollor-contact-messages-'+$('period').value+(excel?'-excel':'')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('csv').onclick=()=>download(false);$('excel').onclick=()=>download(true);
</script></body></html>
